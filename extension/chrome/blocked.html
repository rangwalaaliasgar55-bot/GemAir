<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Blocked</title>
<style>
:root{color-scheme:dark}
body{margin:0;height:100vh;display:grid;place-items:center;background:#0b0d12;color:#eef2f8;
font-family:"Segoe UI",system-ui,sans-serif}
.card{max-width:440px;text-align:center;padding:32px}
.mark{width:40px;height:40px;border-radius:14px;margin:0 auto 20px;
background:linear-gradient(140deg,#6f8cff,#3ad0c0)}
h1{font-size:22px;font-weight:650;letter-spacing:-.02em;margin:0 0 8px}
.site{color:#ff6b6b}
p{color:#97a2b3;font-size:13.5px;line-height:1.6;margin:0 0 6px}
.tag{display:inline-block;margin-top:18px;font-size:11px;padding:4px 10px;border-radius:20px;
background:rgba(255,107,107,.14);color:#ff9a9a}
.hint{margin-top:22px;font-size:12px;color:#6b7688}
a{color:#8ea6ff;text-decoration:none}
</style></head>
<body><div class="card">
<div class="mark"></div>
<h1><span class="site" id="site"></span> is blocked</h1>
<p id="reason"></p>
<div class="tag" id="tag" hidden>Protected block — cannot be dismissed</div>
<p class="hint">Change this in Gem Air → Blocking. Attempts are recorded in your private activity log.
<br><a href="https://focusarx.site" target="_blank" rel="noreferrer">Attention resources at focusarx.site</a></p>
</div>
<script src="blocked.js"></script></body></html>
