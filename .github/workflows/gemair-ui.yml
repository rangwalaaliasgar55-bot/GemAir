name: GemAir UI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selfcheck:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Zero-dependency self-check
        run: node scripts/selfcheck.js
