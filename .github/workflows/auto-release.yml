name: Auto stable release

# Fully automatic stable releases: whenever package.json on main carries a
# stable semver NEWER than the latest published release, this tags
# v<version>. The tag push triggers .github/workflows/release.yml, which
# builds the installers and publishes the GitHub release — so the desktop
# app's stable update channel picks it up with zero manual steps.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag v<package.json version> when it is newer than latest release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const m = String(pkg.version || '').match(/^(\d+)\.(\d+)\.(\d+)$/);
            if (!m) {
              core.info(`package version "${pkg.version}" is not stable semver — skipping auto-release`);
              return;
            }
            const tag = `v${pkg.version}`;
            const { owner, repo } = context.repo;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              core.info(`${tag} already exists — nothing to do`);
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            let latest = [0, 0, 0];
            try {
              const { data } = await github.rest.repos.getLatestRelease({ owner, repo });
              const lm = String(data.tag_name || '').match(/^v?(\d+)\.(\d+)\.(\d+)$/);
              if (lm) latest = [+lm[1], +lm[2], +lm[3]];
            } catch (e) {
              if (e.status !== 404) throw e;
              core.info('no previous stable release found — will tag');
            }
            const cur = [+m[1], +m[2], +m[3]];
            let newer = false;
            for (let i = 0; i < 3; i++) {
              if (cur[i] !== latest[i]) { newer = cur[i] > latest[i]; break; }
            }
            if (!newer) {
              core.info(`${tag} is not newer than latest release — skipping`);
              return;
            }
            await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: context.sha });
            core.info(`created ${tag} — release.yml will now build and publish it`);
