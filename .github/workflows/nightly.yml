name: Nightly build

# Builds installers from every push to main (and nightly on schedule) and
# publishes them to a rolling "nightly" pre-release, so the desktop app's
# nightly update channel always has something fresh to install.
#
# NOTE: this previously used marvinpinto/action-automatic-releases, which is
# archived and fails on current runners — ncipollo/release-action is the
# maintained replacement for rolling tags.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify release metadata
        run: npm run verify:release
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: gemair-nightly-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.*
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          mkdir -p dist
          # Include electron-updater metadata (latest*.yml) and blockmaps so the
          # nightly channel's in-app auto-update and differential downloads work.
          find artifacts -type f \( -name '*.exe' -o -name '*.exe.blockmap' -o -name '*.dmg' -o -name '*.dmg.blockmap' -o -name '*.zip' -o -name '*.zip.blockmap' -o -name '*.AppImage' -o -name '*.AppImage.blockmap' -o -name '*.deb' -o -name 'latest*.yml' \) -exec cp {} dist/ \;
          ls -la dist || true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish rolling nightly pre-release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: GemAir nightly
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          commit: main
          artifacts: "dist/*"
