# Supabase CLI / GitHub-integration config for GemAI.
# The GitHub integration reads supabase/migrations/*.sql and applies any
# migration that has not run yet whenever the production branch updates.

project_id = "gemai"

[db]
# Must match the Postgres major version of your Supabase project
# (Dashboard → Settings → Infrastructure). 15 is the current default.
major_version = 15

[auth]
# GemAI signs users in silently so there is no login screen; Row-Level
# Security still isolates every user's rows from everyone else's.
enable_anonymous_sign_ins = true
