name: Release

# ---------------------------------------------------------------------------
# INSTALL THIS FILE (one step, one time)
#
#   mkdir -p .github/workflows
#   git mv scripts/release-workflow.yml .github/workflows/release.yml
#   git commit -m "Add release workflow" && git push
#
# It ships here rather than in .github/workflows/ because the automation that
# opened this PR is not granted GitHub's `workflows` permission and cannot
# create workflow files. Moving it yourself takes a second and activates it.
# ---------------------------------------------------------------------------

# Builds signed-less desktop installers for Windows, macOS and Linux and
# attaches them to a GitHub Release. The renderer's Download dialog reads
# these assets straight from the GitHub API, so publishing a tag is all it
# takes to make "Get the app" work.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# You can also run it by hand from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: npm run dist:win
          - os: macos-latest
            build: npm run dist:mac
          - os: ubuntu-latest
            build: npm run dist:linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build installer
        run: ${{ matrix.build }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder tries to notarise/sign without these; skip it so
          # the workflow runs on a fork with no certificates configured.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemair-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
            -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} out/ \;
          ls -lh out || true

      - name: Create / update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: GemAir ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
