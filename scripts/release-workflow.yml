name: Release

# ---------------------------------------------------------------------------
# INSTALL THIS FILE (one time)
#
# The path matters. GitHub ONLY runs workflows at:
#
#     .github/workflows/release.yml       <-- repository ROOT
#
# NOT scripts/.github/workflows/release.yml — a nested copy is inert and will
# never run.
#
# Easiest route, in the browser:
#   1. GitHub -> Add file -> Create new file
#   2. Type this EXACT filename, slashes included:
#          .github/workflows/release.yml
#      (typing the slashes creates the folders for you)
#   3. Paste this whole file, then Commit.
#
# Or from a terminal:
#   mkdir -p .github/workflows
#   git mv scripts/release-workflow.yml .github/workflows/release.yml
#   git commit -m "Add release workflow" && git push
#
# It ships here rather than pre-installed because the automation that opened
# this PR is not granted GitHub's `workflows` permission, so it is blocked from
# creating workflow files at all (verified: both git push and the REST API
# return 403).
# ---------------------------------------------------------------------------

# Builds signed-less desktop installers for Windows, macOS and Linux and
# attaches them to a GitHub Release. The renderer's Download dialog reads
# these assets straight from the GitHub API, so publishing a tag is all it
# takes to make "Get the app" work.
#
#   git tag v2.0.0 && git push origin v2.0.0
#
# You can also run it by hand from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: npm run dist:win
          - os: macos-latest
            build: npm run dist:mac
          - os: ubuntu-latest
            build: npm run dist:linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build installer
        run: ${{ matrix.build }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder tries to notarise/sign without these; skip it so
          # the workflow runs on a fork with no certificates configured.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemair-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
            -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} out/ \;
          ls -lh out || true

      - name: Create / update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: GemAir ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
