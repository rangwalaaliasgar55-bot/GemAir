<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- No remote scripts, fonts, or styles: a packaged desktop app should not
       reach the network to render its own chrome. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
  <title>GemAir</title>
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: rgba(255, 255, 255, 0.04);
      --bg-tertiary: rgba(255, 255, 255, 0.06);
      --bg-hover: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 140, 255, 0.5);
      --text-primary: #f0f0f5;
      --text-secondary: rgba(255, 255, 255, 0.55);
      --text-tertiary: rgba(255, 255, 255, 0.3);
      --accent: #638cff;
      --accent-hover: #7da0ff;
      --error: #f87171;
      --warn: #fbbf24;
      --msg-user: linear-gradient(135deg, #638cff 0%, #5a7af5 100%);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      font-size: 13px;
    }

    #titlebar {
      height: 44px;
      padding: 0 8px 0 16px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      -webkit-app-region: drag;
      flex-shrink: 0;
    }
    #titlebar .name { font-weight: 600; letter-spacing: 0.01em; }
    #titlebar .tier {
      color: var(--text-tertiary);
      font-size: 11px;
      margin-left: auto;
      padding-right: 6px;
    }
    /* Kept for the "open settings" affordance on a failed reply. */
    #titlebar .tier.low { color: var(--warn); }
    .win-btn {
      -webkit-app-region: no-drag;
      width: 30px; height: 28px;
      border: 0; border-radius: var(--radius-sm);
      background: transparent; color: var(--text-secondary);
      cursor: pointer; font-size: 14px; line-height: 1;
    }
    .win-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .win-btn svg { display: block; margin: auto; }

    #messages { flex: 1; overflow-x: hidden; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    /* A thin scrollbar in the app's colours for the conversation, instead of
       Windows' wide grey default. scrollbar-width/-color must stay unset:
       Chromium ignores these rules once either is set. */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14); background-clip: padding-box;
      border: 2px solid transparent; border-radius: 8px; min-height: 40px;
    }
    ::-webkit-scrollbar-thumb:hover { background-color: rgba(255, 255, 255, 0.26); }
    ::-webkit-scrollbar-corner { background: transparent; }
    .msg { max-width: 88%; padding: 9px 12px; border-radius: var(--radius-md); line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--msg-user); color: #fff; }
    .msg.assistant { align-self: flex-start; background: var(--bg-secondary); border: 1px solid var(--border); }
    .msg.system { align-self: center; color: var(--text-tertiary); font-size: 11px; text-align: center; max-width: 100%; }
    .msg.error { align-self: flex-start; background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.3); color: var(--error); }
    .msg .add-credit {
      display: block; margin-top: 8px; padding: 6px 12px; border: 0; border-radius: var(--radius-sm);
      background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; font-size: 12px; font-family: inherit;
    }
    .msg .add-credit:hover { background: var(--accent-hover); }

    #welcome { margin: auto; text-align: center; color: var(--text-secondary); padding: 24px; line-height: 1.6; }
    #welcome h2 { font-size: 15px; color: var(--text-primary); margin-bottom: 6px; }

    #setup { padding: 16px; border-top: 1px solid var(--border); display: none; flex-direction: column; gap: 10px; }
    #setup.visible { display: flex; }
    #setup .row { display: flex; gap: 8px; }
    #setup p { color: var(--text-secondary); line-height: 1.5; }
    button.primary {
      flex: 1; padding: 9px 12px; border: 0; border-radius: var(--radius-sm);
      background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; font-size: 12px;
    }
    button.primary:hover { background: var(--accent-hover); }
    button.secondary {
      flex: 1; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg-secondary); color: var(--text-primary); cursor: pointer; font-size: 12px;
    }
    button.secondary:hover { background: var(--bg-hover); }
    input[type=text], input[type=password] {
      flex: 1; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg-secondary); color: var(--text-primary); font-size: 12px; font-family: inherit; outline: none;
    }
    input:focus { border-color: var(--border-focus); }

    #status { padding: 0 16px 6px; color: var(--text-tertiary); font-size: 11px; height: 18px; }

    #input-area { padding: 12px 16px 16px; display: flex; gap: 8px; border-top: 1px solid var(--border); flex-shrink: 0; }
    #send {
      width: 36px; border: 0; border-radius: var(--radius-sm);
      background: var(--accent); color: #fff; cursor: pointer; font-size: 15px;
    }
    #send:hover { background: var(--accent-hover); }
    #send:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>
  <div id="titlebar">
    <span class="name">GemAir</span>
    <span class="tier" id="tier"></span>
    <button class="win-btn" id="guide-btn" title="Install guide">&#9776;</button>
    <!-- Settings in one click from the chat. Before, the only way in was the
         tray icon's right-click menu, and on Windows 11 that icon hides
         behind the ^ arrow by the clock. An inline SVG, not a gear
         character, which Windows would draw as a colour emoji. -->
    <button class="win-btn" id="settings-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor">
        <!-- Eight teeth: one thick dashed ring (circumference 41.5 / 8). -->
        <circle cx="10" cy="10" r="7" stroke-width="2.8" stroke-dasharray="2.75 2.75"></circle>
        <circle cx="10" cy="10" r="5" stroke-width="1.6"></circle>
        <circle cx="10" cy="10" r="1.9" stroke-width="1.5"></circle>
      </svg>
    </button>
    <button class="win-btn" id="min-btn" title="Minimize">&#8211;</button>
    <button class="win-btn" id="close-btn" title="Close">&#10005;</button>
  </div>

  <div id="messages">
    <div id="welcome">
      <h2>Ask about your screen</h2>
      <div>GemAir reads what is on screen and points at what you need.</div>
    </div>
  </div>

  <!-- Shown only when GemAir genuinely cannot reach a model. The free routes
       need no key, so this is almost never up: it appears when the reader has
       PINNED a route (their own `opencode` binary, or a local server) that is
       not currently there. -->
  <div id="setup">
    <p id="setup-text">GemAir can't reach a model right now.</p>
    <div class="row">
      <button class="primary" id="use-free">Use the free hosted models</button>
    </div>
    <div class="row">
      <input type="password" id="byo-key" placeholder="…or paste your own OpenCode key">
      <button class="secondary" id="save-key" style="flex:0 0 auto">Save</button>
    </div>
  </div>

  <div id="status"></div>

  <div id="input-area">
    <input type="text" id="input" placeholder="Ask about your screen..." autofocus>
    <button id="send" title="Send">&#10148;</button>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const welcomeEl = document.getElementById('welcome');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const statusEl = document.getElementById('status');
    const setupEl = document.getElementById('setup');
    const setupTextEl = document.getElementById('setup-text');
    const tierEl = document.getElementById('tier');

    function addMessage(text, kind) {
      if (welcomeEl && welcomeEl.parentNode) welcomeEl.remove();
      const el = document.createElement('div');
      el.className = 'msg ' + kind;
      el.textContent = text;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    function showStatus(text) {
      statusEl.textContent = text || '';
    }

    /**
     * Upstream this read "do you have a credential, and how much money is left
     * on it". Neither question exists in GemAir: every route is free and the
     * hosted one answers a public token. What is left is whether a model can be
     * reached at all, and which route is answering — shown in the title bar
     * where the balance used to be.
     */
    async function refreshRouteState() {
      const settings = await window.gemair.getSettings();
      const route = settings.route;
      // The setup panel is for the one real failure: a pinned route that is not
      // there. Anything else can answer, so nothing is asked of the reader.
      const canAnswer = Boolean(route && route.route);
      setupEl.classList.toggle('visible', !canAnswer);
      tierEl.textContent = route && route.route ? route.route : '';
      tierEl.title = route && route.model ? 'Model: ' + route.model + ' — free' : '';
      tierEl.classList.remove('low');

      if (!settings.secretStorageAvailable) {
        // A key is optional here, unlike upstream, so this is a note rather
        // than a dead end: the free hosted route still works.
        document.getElementById('save-key').disabled = true;
        setupTextEl.textContent =
          'This machine will not let GemAir encrypt a stored key, so your own key cannot be saved. The free hosted models still work.';
      }
      return settings;
    }

    function renderRoute(route) {
      if (!route) return;
      tierEl.textContent = route.route || '';
      tierEl.title = route.model ? 'Model: ' + route.model + ' — free' : '';
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = '';
      sendBtn.disabled = true;
      addMessage(text, 'user');
      showStatus('Reading screen…');
      try {
        const response = await window.gemair.sendQuery(text);
        addMessage(response || '(no answer)', 'assistant');
      } catch (error) {
        // The main process already turned this into a sentence meant for a
        // person; a raw status code never reaches here. It is read back from
        // the main process because an invoke rejection carries only a
        // prefixed message.
        const failure = await window.gemair.lastChatFailure();
        const errorEl = addMessage(
          failure && failure.message
            ? failure.message
            : String(error && error.message ? error.message : error),
          'error'
        );
        if (failure && failure.requiresSetup) {
          // Nothing to buy — the one useful next step is Settings, where the
          // route can be un-pinned or a key pasted.
          const settingsButton = document.createElement('button');
          settingsButton.className = 'add-credit';
          settingsButton.textContent = 'Open settings';
          settingsButton.addEventListener('click', () => window.gemair.openSettings());
          errorEl.appendChild(settingsButton);
        }
        await refreshRouteState();
      } finally {
        sendBtn.disabled = false;
        showStatus('');
        inputEl.focus();
      }
    }

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); send(); }
    });

    // "Use the free hosted models": clears whatever route was pinned, which is
    // the only thing that can make GemAir unable to answer.
    document.getElementById('use-free').addEventListener('click', async () => {
      const button = document.getElementById('use-free');
      button.disabled = true;
      showStatus('Switching to the free hosted models…');
      await window.gemair.setSetting('providerPreference', '');
      await window.gemair.refreshRoute();
      button.disabled = false;
      showStatus('');
      addMessage('GemAir will answer on the free hosted models.', 'system');
      await refreshRouteState();
    });
    document.getElementById('save-key').addEventListener('click', async () => {
      const keyInput = document.getElementById('byo-key');
      const key = keyInput.value.trim();
      if (!key) return;
      const stored = await window.gemair.setSetting('openCodeApiKey', key);
      keyInput.value = '';
      if (stored) {
        addMessage(
          'Key saved, encrypted by this machine\'s own secret store. It is only ever sent to opencode.ai, and only free models are requested with it.',
          'system'
        );
      } else {
        addMessage('GemAir could not encrypt that key on this machine, so it was not saved.', 'error');
      }
      await refreshRouteState();
    });

    document.getElementById('guide-btn').addEventListener('click', () => window.gemair.openGuide());
    document.getElementById('settings-btn').addEventListener('click', () => window.gemair.openSettings());
    document.getElementById('min-btn').addEventListener('click', () => window.gemair.minimizeWindow());
    document.getElementById('close-btn').addEventListener('click', () => window.gemair.closeWindow());

    window.gemair.onStage(({ label }) => showStatus(label));
    window.gemair.onRouteChanged((route) => renderRoute(route));
    // Coming back to the window is when a route that went away gets noticed.
    window.addEventListener('focus', () => { window.gemair.refreshRoute().then(renderRoute); });

    refreshRouteState();
  </script>
</body>
</html>
